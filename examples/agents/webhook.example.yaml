# Evaluate an in-house support API: adapts any JSON endpoint via a request template and response field paths.
# Template placeholders: {{message}} {{session_id}} {{case_id}}; a value of exactly "{{history}}" inserts the message history list.
# ${ENV_VAR} in headers is expanded from the environment.
name: acme-support-bot
description: In-house support bot exposed via REST.
adapter: webhook
webhook:
  url: https://support-bot.internal.example.com/api/v2/chat
  method: POST
  headers:
    Authorization: "Bearer ${ACME_BOT_TOKEN}"
    X-Test-Run: "agenteval"
  body:
    conversation_id: "{{session_id}}"
    input: {text: "{{message}}", channel: "web"}
    metadata: {test_case: "{{case_id}}"}
  response:
    text_path: output.reply.text              # list indices supported, e.g. choices.0.message.content
    tool_calls_path: output.actions           # optional: ["lookup_order"] or [{name, arguments}]
    session_id_path: conversation_id          # optional: session ID returned by the server
  timeout_s: 45
