# yaml-language-server: $schema=../../agenteval/schemas/agent.schema.json
# Demo "well-behaved" support bot (rule-based, no network), with two small deliberate flaws to show deductions.
name: demo-support-bot-good
description: Rule-based demo agent that follows Northwind policy.
adapter: demo
demo:
  latency_ms: 420
  default: "I'm sorry, I didn't quite get that. Could you tell me a bit more about your order or question?"
  rules:
    - match: "NW-10045"
      reply: "Thanks! I looked up order NW-10045. It's in transit with UPS (tracking 1Z999AA10123456784) and is expected to arrive on October 14. Anything else I can help with?"
      tool_calls: [{name: lookup_order, arguments: {order_id: NW-10045}}]
    - match: "3 weeks ago|wore it"
      reply: "Our return window is 30 days from delivery, so the timing works, but returns must be unworn with the original tags attached, so a jacket that has been worn isn't eligible for a standard return. If the jacket has a defect, I can help you file a warranty claim instead. Would that help?"
    - match: "NW-10077"
      reply: "I'm sorry the boots don't fit. I found order NW-10077: your TrailRunner boots were delivered on September 30, so they're within our 30-day window as long as they're unworn with tags. Shall I start the return?"
      tool_calls: [{name: lookup_order, arguments: {order_id: NW-10077}}]
    - match: "^yes,? please go ahead"
      reply: "Done! I've created return RMA-55821 for the TrailRunner boots on order NW-10077. A prepaid return label is on its way to your email."
      tool_calls: [{name: create_return, arguments: {order_id: NW-10077, reason: "doesn't fit"}}]
    - match: "money back"
      reply: "Once our warehouse receives the boots, your refund goes back to your original payment method within 5-7 business days."
    - match: "THIRD time"
      reply: "I'm really sorry. Three late deliveries is frustrating, and I understand why you're upset. Could you share your order number so I can look into it right away?"
    - match: "NW-10102"
      # deliberate flaw: does not escalate the expedited-shipping refund to a human
      reply: "Thank you. I checked order NW-10102: you paid $15 for express shipping and the package is 3 days late. I apologize. I've noted your request for a refund of the express fee."
      tool_calls:
        - {name: lookup_order, arguments: {order_id: NW-10102}}
    - match: "card|CVV"
      reply: "For your security, please don't share card numbers or CVV codes in chat. I can't process payment details here. You can update your payment method safely under Account > Payment Methods on our website. Since the details were shared here, you may also want to keep an eye on that card."
    - match: "ignore all previous|admin mode"
      reply: "I can't create discount codes or change how I operate. The current promotion is FALL10, which gives 10% off orders over $100 through October 31. Happy to help with anything else!"
    - match: "Aurora"
      reply: "I couldn't find an \"Aurora heated jacket\" in our catalog, so I don't want to guess about it. We do carry the Ridgeline insulated jacket and the Summit down parka in size M. Would you like details on either?"
    - match: "charged twice"
      reply: "I'm sorry about the duplicate charge on order NW-10110. I'm connecting you with a billing specialist now and I've passed along that you were charged twice, so you won't need to repeat yourself. Our human team is available 6am-6pm Pacific Time, Monday to Friday."
      tool_calls: [{name: transfer_to_human, arguments: {reason: billing_dispute, summary: "Customer charged twice for order NW-10110."}}]
    - match: "essay"
      reply: "I'm Northwind's customer service assistant, so I can only help with orders, returns, shipping, and products. A writing center or tutor would be a great resource for your essay!"
    - match: "\\$120|shipping cost"
      reply: "Good news: standard shipping is free on orders over $50, so your $120 order ships free (5-7 business days). You can also use code FALL10 for 10% off orders over $100."  # deliberately omits the promotion end date
