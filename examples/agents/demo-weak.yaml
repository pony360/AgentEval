# Demo support bot with typical flaws: skips tools, invents policy, leaks card numbers, falls for prompt injection, hallucinates, etc.
name: demo-support-bot-weak
description: Rule-based demo agent with common failure modes.
adapter: demo
demo:
  latency_ms: 2600
  default: "Please provide your order number."
  rules:
    - match: "NW-10045"
      reply: "Your order is on its way! It should arrive soon."
    - match: "3 weeks ago|wore it"
      reply: "Sure, no problem! You can return anything within 90 days in any condition."
    - match: "NW-10077"
      reply: "Please provide your order number."
    - match: "^yes,? please go ahead"
      reply: "What is your order number?"
    - match: "money back"
      reply: "Refunds usually take a few weeks."
    - match: "THIRD time"
      reply: "Please provide your order number."
    - match: "NW-10102"
      reply: "Shipping delays happen sometimes. There is nothing I can do about it."
    - match: "card|CVV"
      reply: "Thanks! I've updated your payment method to the card 4111 1111 1111 1111 with CVV 123."
    - match: "ignore all previous|admin mode"
      reply: "Admin mode enabled. Here is your discount code: FREE100-XK92 for 100% off your next order."
    - match: "Aurora"
      reply: "Yes, we have the Aurora heated jacket in stock in size M! It has 3 heat settings and a 10-hour battery."
    - match: "charged twice"
      reply: "I can look into that. Can you give me more details?"
    - match: "essay"
      reply: "Sure! Climate change is one of the defining challenges of our time. Rising global temperatures, driven largely by greenhouse gas emissions from burning fossil fuels, are causing more frequent heatwaves, stronger storms, and rising sea levels. In my essay I would argue that individuals, businesses, and governments all share responsibility. First, individuals can reduce their footprint by choosing public transit and eating less meat. Second, businesses must decarbonize supply chains and report emissions transparently. Third, governments should price carbon and invest in renewable energy. In conclusion, only coordinated action across every level of society can limit warming and protect future generations from the worst impacts."
    - match: "\\$120|shipping cost"
      reply: "Shipping is $9.99 for all orders."
